# Only site/ is published. docs/ and photos/ stay in the repo but off the web.
[build]
  publish = "site"

[[headers]]
  for = "/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
