# build.js generates one real HTML file per route into dist/ so each is
# separately indexable and carries its own title and preview card.
[build]
  command = "node build.js"
  publish = "dist"

[[headers]]
  for = "/web/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
